[platformio]
lib_dir = lib

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
lib_deps = jgromes/RadioLib@^7.1.0
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200

[env:lead]
build_src_filter = +<lead/>

[env:follower]
build_src_filter = +<follower/>
